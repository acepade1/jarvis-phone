name: Build APK
on:
  workflow_dispatch: {}
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Make signing key (per build)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/jarvis.p12" -storetype PKCS12 \
            -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jarvis-build -keypass jarvis-build -dname "CN=Jarvis"
      - name: Build release APK
        working-directory: android
        env:
          KS_FILE: ${{ runner.temp }}/jarvis.p12
          KS_PASS: jarvis-build
        run: gradle --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk jarvis.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jarvis.apk --title "Jarvis APK" --notes "Android APK. Download and install on your phone."
